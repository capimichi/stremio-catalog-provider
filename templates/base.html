<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Stremio Catalog Provider{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="/static/images/favicon.png">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-brand">
            <img src="/static/images/logo.png" alt="Logo" class="sidebar-logo">
            Stremio<span>Catalog</span>
        </div>
        <ul class="sidebar-menu">
            <li class="sidebar-menu-item {% if active_page == 'dashboard' %}active{% endif %}">
                <a href="/dashboard">Dashboard</a>
            </li>
            <li class="sidebar-menu-item {% if active_page == 'media' %}active{% endif %}">
                <a href="/media">Media</a>
            </li>
            <li class="sidebar-menu-item {% if active_page == 'torrents' %}active{% endif %}">
                <a href="/torrents">Torrents</a>
            </li>
        </ul>
    </div>
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <!-- Toast Notifications Container -->
    <div class="toast-container" id="toast-container"></div>

    <script>
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = `toast-item toast-item-${type}`;

            let iconClass = 'fa-circle-check';
            if (type === 'error') {
                iconClass = 'fa-circle-xmark';
            } else if (type === 'warning') {
                iconClass = 'fa-triangle-exclamation';
            }

            toast.innerHTML = `
                <i class="fa-solid ${iconClass} toast-icon"></i>
                <div class="toast-message">${message}</div>
                <i class="fa-solid fa-xmark toast-close"></i>
            `;

            container.appendChild(toast);

            // Trigger reflow to apply transition
            toast.offsetHeight;
            toast.classList.add('show');

            const closeBtn = toast.querySelector('.toast-close');
            closeBtn.addEventListener('click', () => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            });

            // Auto-remove after 4 seconds
            setTimeout(() => {
                if (toast.parentNode) {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 400);
                }
            }, 4000);
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
